"><time class="news-date" datetime="2026-10-03">2026.10.03</time><span class="news-category">限定菜單</span></div><h1>鴨肉蔥拌麵，10月繼續供應</h1><p>9月限定的鴨肉蔥拌麵廣受好評，將在10月繼續供應。</p><p>鴨肉和蔥接單後炙烤，再搭配濃郁蛋黃和特製醬汁。請與極粗麵一起享受現烤香氣與鴨肉鮮味。</p><p>供應至10月31日，含稅1,580日圓起。每月22日「ぶっとく之日」不供應限定菜單。</p><figure style="margin:0"><img class="news-image" src="/news-duck-202610.jpg" alt="鴨肉蔥拌麵，10月繼續供應" width="1402" height="1752"><figcaption>官方Instagram宣傳圖片（含AI生成圖片）</figcaption></figure><p><a href="https://www.instagram.com/buttoi_men/p/Dd6rGQXSfj1/" target="_blank" rel="noopener">官方Instagram公告</a></p><a class="news-back" href="/zh-hant/news/">← 返回消息一覽</a></article></main><footer class="news-footer">MENYA BUTTOKUIKIRO · © 2026</footer></body></html>
